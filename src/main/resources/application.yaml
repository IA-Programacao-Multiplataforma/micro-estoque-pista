server:
  port: ${PORT:8082}

spring:
  application:
    name: estoque
  data:
    mongodb:
      auto-index-creation: true
      # Credenciais vêm de variáveis de ambiente (MONGO_URI, RABBITMQ_URI), nunca do código
      uri: ${MONGO_URI}
  rabbitmq:
    addresses: ${RABBITMQ_URI}
    listener:
      simple:
        # Se o processamento falhar, tenta 3 vezes e depois manda para a fila morta (.dlq)
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2.0

estoque:
  max-ingressos-por-compra: 6
